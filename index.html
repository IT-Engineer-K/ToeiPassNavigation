<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#15803d" />
  <title>ToeiPassNavigation - 都営交通無料乗車券 対応 乗換案内</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --primary: #15803d;
      --primary-hover: #166534;
      --primary-light: #dcfce7;
      --accent: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ヘッダー */
    .app-header {
      background: linear-gradient(135deg, #14532d 0%, #15803d 100%);
      color: #ffffff;
      padding: 16px 16px 22px;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      box-shadow: 0 3px 12px rgba(21, 128, 61, 0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .app-title {
      font-size: 1.18rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toei-badge {
      background: #ffffff;
      color: #14532d;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .app-subtitle {
      font-size: 0.78rem;
      opacity: 0.92;
    }

    /* 検索フォームカード */
    .search-card {
      background: var(--card);
      margin: -12px 12px 12px;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.07);
      border: 1px solid var(--border);
    }

    .station-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      position: relative;
    }

    .station-label {
      width: 40px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      flex-shrink: 0;
    }

    .autocomplete-wrapper {
      flex: 1;
      position: relative;
    }

    .station-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 34px 10px 12px;
      font-size: 0.96rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .station-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.14);
    }

    .clear-input-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #cbd5e1;
      color: #1e293b;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .suggest-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 12px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
      display: none;
    }

    .suggest-list.open {
      display: block;
    }

    .suggest-item {
      padding: 11px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .suggest-item:last-child {
      border-bottom: none;
    }

    .suggest-item:hover {
      background: var(--primary-light);
      color: #14532d;
    }

    .suggest-area {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    .action-btn {
      min-height: 44px;
      padding: 0 11px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn.home-btn {
      background: var(--primary-light);
      border-color: #86efac;
      color: #14532d;
    }

    .action-btn:hover {
      background: #e2e8f0;
    }

    /* 日時・ダイヤ条件バー（Yahoo!乗換案内スタイル） */
    .time-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 12px 0 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }

    .time-input {
      min-height: 38px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: 0.88rem;
      font-weight: 700;
      background: #f8fafc;
      color: var(--text);
    }

    .time-mode-group {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .time-mode-btn {
      padding: 6px 12px;
      border: none;
      background: #f8fafc;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
    }

    .time-mode-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .now-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 条件設定パネル */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .option-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      min-height: 42px;
    }

    .option-toggle.full-width {
      grid-column: 1 / -1;
    }

    .option-toggle.active {
      background: var(--primary-light);
      border-color: #4ade80;
      color: #14532d;
    }

    .option-toggle input {
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .search-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(21, 128, 61, 0.22);
    }

    .search-btn:hover {
      background: var(--primary-hover);
    }

    /* プリセット＆履歴 */
    .presets-section {
      margin: 0 12px 12px;
    }

    .section-label {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .presets-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .preset-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
    }

    .preset-chip:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #14532d;
    }

    /* Yahoo!乗換案内風 サマリータブ */
    .route-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
      gap: 8px;
      margin: 0 12px 12px;
    }

    .route-tab {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }

    .route-tab.active {
      border-color: var(--primary);
      background: #f0fdf4;
      box-shadow: 0 2px 8px rgba(21, 128, 61, 0.14);
    }

    .tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .tab-num {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--muted);
    }

    .tab-badges {
      display: flex;
      gap: 3px;
    }

    .badge {
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .tab-fare {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text);
    }

    .tab-sub {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
    }

    /* 経路詳細カード */
    .results-section {
      margin: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .route-card {
      background: var(--card);
      border-radius: 16px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .route-header {
      padding: 14px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .route-time-headline {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .route-duration-pill {
      font-size: 0.82rem;
      font-weight: 800;
      background: #e2e8f0;
      color: #1e293b;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .fare-headline {
      text-align: right;
      flex-shrink: 0;
    }

    .total-fare-value {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--primary);
    }

    .route-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
      flex-wrap: wrap;
      gap: 8px;
    }

    .route-meta-bar strong {
      color: var(--text);
    }

    /* タイムライン */
    .timeline {
      padding: 16px;
    }

    .station-node {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .node-time {
      width: 44px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      flex-shrink: 0;
      padding-top: 1px;
    }

    .station-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text);
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 2px var(--text);
      flex-shrink: 0;
      margin-top: 4px;
    }

    .node-body {
      flex: 1;
    }

    .node-name {
      font-weight: 900;
      font-size: 0.96rem;
      color: var(--text);
    }

    .node-barrier-free {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 2px;
    }

    .segment-bar {
      margin: 6px 0 6px 54px;
      padding: 10px 0 10px 16px;
      border-left: 5px solid #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .segment-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .line-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .line-code-badge {
      display: inline-block;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .segment-sub {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }

    .stops-toggle-btn {
      align-self: flex-start;
      margin-top: 2px;
      border: none;
      background: #f1f5f9;
      color: #334155;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .stops-detail-box {
      display: none;
      margin-top: 4px;
      padding: 6px 10px;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 600;
    }

    .stops-detail-box.open {
      display: block;
    }

    .segment-fare {
      text-align: right;
      flex-shrink: 0;
    }

    .segment-price {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--text);
    }

    .segment-price.toei-free {
      color: #14532d;
      background: #dcfce7;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .segment-note {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* データ管理フッター */
    .admin-box {
      margin: 20px 12px 0;
      padding: 14px 16px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--muted);
    }

    .admin-box h3 {
      font-size: 0.84rem;
      color: var(--text);
      margin-bottom: 4px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .secondary-btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-top">
        <div class="app-title">
          <span class="toei-badge">都営無料乗車券</span>
          <span>ToeiPassNavigation</span>
        </div>
      </div>
      <p class="app-subtitle">
        都営交通無料乗車券（都営0円）＋JR・メトロ・私鉄 乗換案内
      </p>
    </header>

    <section class="search-card" aria-label="経路検索フォーム">
      <div class="station-row">
        <label for="fromInput" class="station-label">出発</label>
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="fromInput"
            class="station-input"
            placeholder="駅名を入力（例: 武蔵小金井、新宿）"
            autocomplete="off"
          />
          <button type="button" id="clearFromBtn" class="clear-input-btn" aria-label="出発駅をクリア">×</button>
          <div id="fromSuggest" class="suggest-list" role="listbox"></div>
        </div>
        <button type="button" id="homeQuickBtn" class="action-btn home-btn" title="出発を自宅（武蔵小金井）にセット">🏠 自宅</button>
      </div>

      <div class="station-row">
        <label for="toInput" class="station-label">到着</label>
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="toInput"
            class="station-input"
            placeholder="目的地の駅名を入力（例: 六本木、浅草）"
            autocomplete="off"
          />
          <button type="button" id="clearToBtn" class="clear-input-btn" aria-label="到着駅をクリア">×</button>
          <div id="toSuggest" class="suggest-list" role="listbox"></div>
        </div>
        <button type="button" id="swapBtn" class="action-btn" title="出発と到着を入れ替え">⇅ 入替</button>
      </div>

      <div class="time-row">
        <input type="time" id="timeInput" class="time-input" value="09:00" aria-label="時刻指定" />
        <div class="time-mode-group" role="group" aria-label="出発・到着指定">
          <button type="button" id="depModeBtn" class="time-mode-btn active">出発</button>
          <button type="button" id="arrModeBtn" class="time-mode-btn">到着</button>
        </div>
        <button type="button" id="nowTimeBtn" class="now-btn">現在時刻</button>
      </div>

      <div class="options-grid">
        <label class="option-toggle active full-width" id="labelToeiPass">
          <span>都営交通無料乗車券を適用（都営地下鉄・都バス・都電・舎人 0円）</span>
          <input type="checkbox" id="useToeiFreePass" checked />
        </label>
        <label class="option-toggle active" id="labelAccessible">
          <span>🛗 エレベーター余裕乗換</span>
          <input type="checkbox" id="accessibleTransfer" checked />
        </label>
        <label class="option-toggle active" id="labelToeiBus">
          <span>🚌 都営バスを含める</span>
          <input type="checkbox" id="includeToeiBus" checked />
        </label>
      </div>

      <button id="searchBtn" class="search-btn">ルートを検索</button>
    </section>

    <section class="presets-section">
      <div class="section-label">よく使う区間・履歴（タップで即検索）</div>
      <div class="presets-scroll" id="presetContainer"></div>
    </section>

    <nav class="route-tabs" id="routeTabsContainer" aria-label="経路候補一覧"></nav>

    <main class="results-section" id="resultsContainer"></main>

    <footer class="admin-box">
      <h3>路線・運賃データ管理（全200駅・377区間収録）</h3>
      <p>
        ダイヤ改正・運賃改定時はJSON出力・読み込みまたは <code>node scripts/update-data.js</code> で更新できます。
      </p>
      <div class="admin-actions">
        <button id="exportJsonBtn" class="secondary-btn">路線データをJSON出力</button>
        <label class="secondary-btn" style="display:inline-block;">
          JSONデータを読み込む
          <input type="file" id="importJsonInput" accept=".json" style="display:none;" />
        </label>
      </div>
    </footer>
  </div>

  <script src="./data.js"></script>
  <script src="./router.js"></script>
  <script>
    const fromInput = document.getElementById("fromInput");
    const toInput = document.getElementById("toInput");
    const fromSuggest = document.getElementById("fromSuggest");
    const toSuggest = document.getElementById("toSuggest");
    const clearFromBtn = document.getElementById("clearFromBtn");
    const clearToBtn = document.getElementById("clearToBtn");
    const homeQuickBtn = document.getElementById("homeQuickBtn");
    const swapBtn = document.getElementById("swapBtn");
    const timeInput = document.getElementById("timeInput");
    const depModeBtn = document.getElementById("depModeBtn");
    const arrModeBtn = document.getElementById("arrModeBtn");
    const nowTimeBtn = document.getElementById("nowTimeBtn");
    const searchBtn = document.getElementById("searchBtn");
    const routeTabsContainer = document.getElementById("routeTabsContainer");
    const resultsContainer = document.getElementById("resultsContainer");
    const presetContainer = document.getElementById("presetContainer");

    const useToeiFreePassEl = document.getElementById("useToeiFreePass");
    const accessibleTransferEl = document.getElementById("accessibleTransfer");
    const includeToeiBusEl = document.getElementById("includeToeiBus");

    let selectedFromId = "musashi_koganei";
    let selectedToId = "roppongi";
    let timeMode = "departure";
    let currentRoutes = [];
    let activeRouteIndex = 0;

    function getStationById(id) {
      return STATIONS.find(s => s.id === id) || null;
    }

    function getStationName(id) {
      const st = getStationById(id);
      return st ? st.name : id;
    }

    function getStationBarrierFree(id) {
      const st = getStationById(id);
      return st && st.barrierFree ? st.barrierFree : "";
    }

    function setNowTime() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      timeInput.value = `${hh}:${mm}`;
    }

    function getBaseTimeMinutes() {
      const val = timeInput.value || "09:00";
      const [hh, mm] = val.split(":").map(Number);
      return (isNaN(hh) ? 9 : hh) * 60 + (isNaN(mm) ? 0 : mm);
    }

    function filterStations(query) {
      const q = (query || "").trim().toLowerCase();
      if (!q) return STATIONS;
      return STATIONS.filter(st =>
        st.name.toLowerCase().includes(q) ||
        (st.kana && st.kana.toLowerCase().includes(q)) ||
        (st.area && st.area.toLowerCase().includes(q))
      );
    }

    function setupAutocomplete(inputEl, suggestEl, clearBtn, onSelectCallback) {
      function renderList(query) {
        const matches = filterStations(query);
        if (matches.length === 0) {
          suggestEl.innerHTML = `<div class="suggest-item" style="color:var(--muted); cursor:default;">該当する駅が見つかりません</div>`;
          suggestEl.classList.add("open");
          return;
        }
        suggestEl.innerHTML = matches.map(st => `
          <div class="suggest-item" role="option" data-id="${st.id}">
            <span>${st.name}</span>
            <span class="suggest-area">${st.area}</span>
          </div>
        `).join("");
        suggestEl.classList.add("open");

        suggestEl.querySelectorAll(".suggest-item[data-id]").forEach(item => {
          item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const id = item.getAttribute("data-id");
            const st = getStationById(id);
            if (st) {
              inputEl.value = st.name;
              suggestEl.classList.remove("open");
              onSelectCallback(st.id);
              runSearch();
            }
          });
        });
      }

      inputEl.addEventListener("focus", () => renderList(inputEl.value));

      inputEl.addEventListener("input", () => {
        renderList(inputEl.value);
        const matches = filterStations(inputEl.value);
        if (matches.length > 0) {
          onSelectCallback(matches[0].id);
        }
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const matches = filterStations(inputEl.value);
          if (matches.length > 0) {
            inputEl.value = matches[0].name;
            onSelectCallback(matches[0].id);
            suggestEl.classList.remove("open");
            runSearch();
          }
        } else if (e.key === "Escape") {
          suggestEl.classList.remove("open");
        }
      });

      inputEl.addEventListener("blur", () => {
        setTimeout(() => {
          suggestEl.classList.remove("open");
          const matches = filterStations(inputEl.value);
          if (matches.length > 0) {
            inputEl.value = matches[0].name;
            onSelectCallback(matches[0].id);
          }
        }, 150);
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        inputEl.focus();
        renderList("");
      });
    }

    function syncInputsFromState() {
      fromInput.value = getStationName(selectedFromId);
      toInput.value = getStationName(selectedToId);
    }

    function renderPresets() {
      presetContainer.innerHTML = "";
      for (const p of PRESET_QUERIES) {
        const btn = document.createElement("button");
        btn.className = "preset-chip";
        btn.textContent = p.label;
        btn.addEventListener("click", () => {
          selectedFromId = p.from;
          selectedToId = p.to;
          syncInputsFromState();
          runSearch();
        });
        presetContainer.appendChild(btn);
      }
    }

    function bindToggleStyle(checkbox, labelId) {
      const label = document.getElementById(labelId);
      const sync = () => {
        if (checkbox.checked) label.classList.add("active");
        else label.classList.remove("active");
      };
      checkbox.addEventListener("change", () => {
        sync();
        runSearch();
      });
      sync();
    }

    function runSearch() {
      const fromMatches = filterStations(fromInput.value);
      if (fromMatches.length > 0 && !STATIONS.some(s => s.id === selectedFromId && s.name === fromInput.value)) {
        selectedFromId = fromMatches[0].id;
      }
      const toMatches = filterStations(toInput.value);
      if (toMatches.length > 0 && !STATIONS.some(s => s.id === selectedToId && s.name === toInput.value)) {
        selectedToId = toMatches[0].id;
      }

      if (!selectedFromId || !selectedToId || selectedFromId === selectedToId) {
        routeTabsContainer.innerHTML = "";
        resultsContainer.innerHTML = `
          <div class="route-card" style="padding: 20px; text-align: center; color: var(--muted);">
            出発駅と到着駅に異なる駅を入力してください。
          </div>
        `;
        return;
      }

      const options = {
        useToeiFreePass: useToeiFreePassEl.checked,
        accessibleTransfer: accessibleTransferEl.checked,
        includeToeiBus: includeToeiBusEl.checked,
        fareType: "ic",
        timeMode,
        baseTimeMinutes: getBaseTimeMinutes()
      };

      currentRoutes = searchRoutes(selectedFromId, selectedToId, options);
      activeRouteIndex = 0;
      renderRouteTabs();
      renderActiveRoute(options);
    }

    function renderRouteTabs() {
      if (!currentRoutes || currentRoutes.length === 0) {
        routeTabsContainer.innerHTML = "";
        return;
      }

      routeTabsContainer.innerHTML = currentRoutes.map((route, idx) => {
        const badgesHtml = route.badges.map(b =>
          `<span class="badge" style="background:${b.color}">${b.text}</span>`
        ).join("");

        return `
          <button type="button" class="route-tab ${idx === activeRouteIndex ? 'active' : ''}" data-idx="${idx}">
            <div class="tab-top">
              <span class="tab-num">ルート${idx + 1}</span>
              <span class="tab-badges">${badgesHtml}</span>
            </div>
            <div class="tab-fare">${route.totalFare}円</div>
            <div class="tab-sub">${route.totalMinutes}分 ・ 乗換${route.transferCount}回</div>
          </button>
        `;
      }).join("");

      routeTabsContainer.querySelectorAll(".route-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          activeRouteIndex = Number(btn.getAttribute("data-idx"));
          renderRouteTabs();
          renderActiveRoute({
            useToeiFreePass: useToeiFreePassEl.checked,
            accessibleTransfer: accessibleTransferEl.checked
          });
        });
      });
    }

    function renderActiveRoute(options) {
      if (!currentRoutes || currentRoutes.length === 0) {
        resultsContainer.innerHTML = `
          <div class="route-card" style="padding: 20px; text-align: center; color: var(--muted);">
            条件に合う経路が見つかりませんでした。
          </div>
        `;
        return;
      }

      const route = currentRoutes[activeRouteIndex] || currentRoutes[0];
      const badgesHtml = route.badges.map(b =>
        `<span class="badge" style="background:${b.color}">${b.text}</span>`
      ).join("");

      let timelineHtml = "";
      route.segments.forEach((seg, idx) => {
        if (idx === 0) {
          const bf = getStationBarrierFree(seg.from);
          timelineHtml += `
            <div class="station-node">
              <span class="node-time">${seg.depTime}</span>
              <span class="station-dot" style="background:${seg.lineColor}; box-shadow: 0 0 0 2px ${seg.lineColor};"></span>
              <div class="node-body">
                <div class="node-name">${getStationName(seg.from)}</div>
                ${bf ? `<span class="node-barrier-free">🛗 ${bf}</span>` : ""}
              </div>
            </div>
          `;
        }

        let fareDisplay = "";
        if (seg.isThroughFare) {
          fareDisplay = `<span class="segment-price ${seg.isToeiFree && options.useToeiFreePass ? 'toei-free' : ''}">${seg.isToeiFree && options.useToeiFreePass ? '0円' : '乗継通算'}</span>`;
        } else {
          fareDisplay = `<span class="segment-price ${seg.fare === 0 ? 'toei-free' : ''}">${seg.fare}円</span>`;
        }

        const intermediateStops = seg.stops.slice(1, -1);
        const stopsCountText = intermediateStops.length > 0
          ? `${seg.stops.length - 1}駅（途中${intermediateStops.length}駅を表示）`
          : `直行（1区間）`;

        const stopsListHtml = intermediateStops.length > 0
          ? intermediateStops.map(s => `・${getStationName(s.id)}`).join("<br/>")
          : "";

        timelineHtml += `
          <div class="segment-bar" style="border-left-color: ${seg.lineColor};">
            <div class="segment-info">
              <div class="line-pill">
                <span class="line-code-badge" style="background:${seg.lineColor}">${seg.lineCode}</span>
                <span>${seg.lineName}</span>
              </div>
              <span class="segment-sub">${seg.dirHint} ・ 乗車${seg.minutes}分 (${seg.km}km)</span>
              ${intermediateStops.length > 0 ? `
                <button type="button" class="stops-toggle-btn" onclick="this.nextElementSibling.classList.toggle('open')">
                  ▼ ${stopsCountText}
                </button>
                <div class="stops-detail-box">${stopsListHtml}</div>
              ` : `<span class="segment-sub">${stopsCountText}</span>`}
            </div>
            <div class="segment-fare">
              ${fareDisplay}
              <span class="segment-note">${seg.fareLabel}</span>
            </div>
          </div>
          <div class="station-node">
            <span class="node-time">${seg.arrTime}</span>
            <span class="station-dot" style="background:${seg.lineColor}; box-shadow: 0 0 0 2px ${seg.lineColor};"></span>
            <div class="node-body">
              <div class="node-name">${getStationName(seg.to)}</div>
              ${getStationBarrierFree(seg.to) ? `<span class="node-barrier-free">🛗 ${getStationBarrierFree(seg.to)}</span>` : ""}
              ${seg.transferWaitMinutes ? `<div class="segment-sub" style="margin-top:2px;">乗換・移動目安 ${seg.transferWaitMinutes}分</div>` : ""}
            </div>
          </div>
        `;
      });

      resultsContainer.innerHTML = `
        <article class="route-card">
          <div class="route-header">
            <div>
              <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
                ${badgesHtml}
                <span style="font-size:0.82rem; font-weight:800; color:var(--muted);">${route.label}</span>
              </div>
              <div class="route-time-headline">
                <span>${route.departTime}発 → ${route.arriveTime}着</span>
                <span class="route-duration-pill">${route.totalMinutes}分</span>
              </div>
            </div>
            <div class="fare-headline">
              <div class="total-fare-value">${route.totalFare}円</div>
            </div>
          </div>
          <div class="route-meta-bar">
            <span>乗車時間 <strong>${route.rideMinutes}分</strong></span>
            <span>乗換 <strong>${route.transferCount}回</strong>（1回${route.transferMargin}分換算）</span>
            <span>距離 <strong>${route.totalKm}km</strong></span>
          </div>
          <div class="timeline">
            ${timelineHtml}
          </div>
        </article>
      `;
    }

    // イベント初期化
    setupAutocomplete(fromInput, fromSuggest, clearFromBtn, (id) => { selectedFromId = id; });
    setupAutocomplete(toInput, toSuggest, clearToBtn, (id) => { selectedToId = id; });

    homeQuickBtn.addEventListener("click", () => {
      selectedFromId = "musashi_koganei";
      syncInputsFromState();
      runSearch();
    });

    swapBtn.addEventListener("click", () => {
      const temp = selectedFromId;
      selectedFromId = selectedToId;
      selectedToId = temp;
      syncInputsFromState();
      runSearch();
    });

    depModeBtn.addEventListener("click", () => {
      timeMode = "departure";
      depModeBtn.classList.add("active");
      arrModeBtn.classList.remove("active");
      runSearch();
    });

    arrModeBtn.addEventListener("click", () => {
      timeMode = "arrival";
      arrModeBtn.classList.add("active");
      depModeBtn.classList.remove("active");
      runSearch();
    });

    nowTimeBtn.addEventListener("click", () => {
      setNowTime();
      runSearch();
    });

    timeInput.addEventListener("change", runSearch);
    searchBtn.addEventListener("click", runSearch);

    bindToggleStyle(useToeiFreePassEl, "labelToeiPass");
    bindToggleStyle(accessibleTransferEl, "labelAccessible");
    bindToggleStyle(includeToeiBusEl, "labelToeiBus");

    // JSON出力・読み込み
    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      const payload = {
        updatedAt: new Date().toISOString(),
        operators: OPERATORS,
        lines: LINES,
        stations: STATIONS,
        edges: EDGES
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "toei-pass-transit-data.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importJsonInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed.stations && parsed.edges) {
            STATIONS.length = 0;
            STATIONS.push(...parsed.stations);
            EDGES.length = 0;
            EDGES.push(...parsed.edges);
            syncInputsFromState();
            runSearch();
            alert("路線・運賃データを手動更新しました。");
          }
        } catch (err) {
          alert("JSONファイルの形式が正しくありません。");
        }
      };
      reader.readAsText(file);
    });

    // 初期表示
    setNowTime();
    syncInputsFromState();
    renderPresets();
    runSearch();
  </script>
</body>
</html>
